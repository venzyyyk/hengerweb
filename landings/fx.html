<!-- hgr-fx:start -->
<style>
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
.lenis.lenis-stopped{overflow:hidden}
#fx-bar{position:fixed;left:0;top:0;height:2px;width:100%;z-index:2147483000;background:var(--accent);transform-origin:0 50%;transform:scaleX(0);pointer-events:none;box-shadow:0 0 12px var(--accent)}
.fx-w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.14em;margin-bottom:-.14em}
.fx-w>.fx-i{display:inline-block;transform:translateY(108%);transition:transform 1.05s cubic-bezier(.22,1,.36,1)}
.fx-on .fx-w>.fx-i{transform:none}
#fx-cur{position:fixed;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;border:1.5px solid var(--accent);border-radius:50%;pointer-events:none;z-index:2147482999;opacity:0;transition:width .35s cubic-bezier(.22,1,.36,1),height .35s cubic-bezier(.22,1,.36,1),margin .35s cubic-bezier(.22,1,.36,1),opacity .3s,background-color .3s}
#fx-cur.on{opacity:.75}
#fx-cur.big{width:62px;height:62px;margin:-31px 0 0 -31px;background:color-mix(in srgb,var(--accent) 14%,transparent)}
#fx-cur.press{width:24px;height:24px;margin:-12px 0 0 -12px}
@media (prefers-reduced-motion:reduce){#fx-cur{display:none}.fx-w>.fx-i{transform:none!important;transition:none!important}}
</style>
<div id="fx-bar" aria-hidden="true"></div>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.20/dist/lenis.min.js"></script>
<script>
(function(){
  var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  var fine=matchMedia('(hover:hover) and (pointer:fine)').matches;
  var root=document.documentElement, bar=document.getElementById('fx-bar');

  /* smooth wheel scroll (desktop only) */
  var lenis=null;
  if(!reduce && fine && window.Lenis){
    lenis=new Lenis({lerp:.1,wheelMultiplier:1,smoothWheel:true});
    var native=Element.prototype.scrollIntoView;
    Element.prototype.scrollIntoView=function(o){
      if(lenis && !(o&&o.behavior==='auto')){ lenis.scrollTo(this,{offset:0,duration:1.3}); }
      else native.apply(this,arguments);
    };
    (function raf(t){
      if(root.classList.contains('loading')) lenis.stop(); else lenis.start();
      lenis.raf(t); requestAnimationFrame(raf);
    })(performance.now());
  }

  /* scroll progress */
  function prog(){ var m=root.scrollHeight-innerHeight; bar.style.transform='scaleX('+(m>0?scrollY/m:0)+')'; }
  addEventListener('scroll',prog,{passive:true}); addEventListener('resize',prog); prog();
  if(reduce) return;

  /* section headings rise word by word */
  function split(el){
    var nodes=[].slice.call(el.childNodes);
    nodes.forEach(function(n){
      if(n.nodeType===3){
        var frag=document.createDocumentFragment();
        n.textContent.split(/(\s+)/).forEach(function(p){
          if(!p) return;
          if(/^\s+$/.test(p)){ frag.appendChild(document.createTextNode(' ')); return; }
          var w=document.createElement('span'); w.className='fx-w';
          var i=document.createElement('span'); i.className='fx-i'; i.textContent=p;
          w.appendChild(i); frag.appendChild(w);
        });
        n.replaceWith(frag);
      } else if(n.nodeType===1 && n.tagName!=='BR'){
        var w=document.createElement('span'); w.className='fx-w';
        var i=document.createElement('span'); i.className='fx-i';
        n.replaceWith(w); i.appendChild(n); w.appendChild(i);
      }
    });
    el.querySelectorAll('.fx-i').forEach(function(s,k){ s.style.transitionDelay=(k*.06)+'s'; });
  }
  var heads=[].slice.call(document.querySelectorAll('main h2, section h2')).filter(function(h){ return !h.closest('.hero,#hero,header,.preloader,.done,[class*="hero"]'); });
  heads.forEach(split);

  var io=new IntersectionObserver(function(en){ en.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('fx-on'); io.unobserve(e.target); } }); },{threshold:.1});
  heads.forEach(function(el){ io.observe(el); });

  /* cursor ring (mouse only) */
  if(fine){
    var cur=document.createElement('div'); cur.id='fx-cur'; cur.setAttribute('aria-hidden','true'); document.body.appendChild(cur);
    var tx=-100,ty=-100,cx=-100,cy=-100;
    addEventListener('pointermove',function(e){ tx=e.clientX; ty=e.clientY; cur.classList.add('on');
      cur.classList.toggle('big',!!(e.target.closest && e.target.closest('a,button,[role="button"],label,.chip,.mitem,.coffee,.zone,.plan,.game')));
    },{passive:true});
    document.addEventListener('pointerleave',function(){ cur.classList.remove('on'); });
    addEventListener('pointerdown',function(){ cur.classList.add('press'); });
    addEventListener('pointerup',function(){ cur.classList.remove('press'); });
    (function loop(){ cx+=(tx-cx)*.2; cy+=(ty-cy)*.2; cur.style.transform='translate('+cx+'px,'+cy+'px)'; requestAnimationFrame(loop); })();
  }
})();
</script>
<!-- hgr-fx:end -->
